services:
  db:
    image: mysql:8.0
    container_name: subastas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: subastas
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

  api:
    build:
      context: ./back/Subastas.Api
      dockerfile: Dockerfile
    container_name: subastas-api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Server=db;Port=3306;Database=subastas;User=app;Password=app;"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  mysql_data: